name: Update contribution snake

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: fumitoshi0524
          outputs: |
            assets/github-snake.svg?color_snake=#8b5cf6&color_dots=#eef2ff,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#f9a8d4&color_dots=#161b22,#334155,#6366f1,#a78bfa,#f9a8d4

      - name: Publish generated animations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution snake'
            git push origin HEAD:main
          fi
